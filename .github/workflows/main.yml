name: Build BankClicker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html www/

          if [ -d "css" ]; then
            cp -r css www/
          fi

          if [ -d "js" ]; then
            cp -r js www/
          fi

          if [ -d "images" ]; then
            cp -r images www/
          fi

          if [ -d "assets" ]; then
            cp -r assets www/
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bankclicker.app",
            "appName": "BankClicker",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android

      - name: Sync Android project
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BankClicker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
